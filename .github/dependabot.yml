# Dependabot will run on day 4 of each month at 03:15 (Europe/Berlin timezone)
version: 2
updates:

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      timezone: "Europe/Berlin"
      cronjob: "15 3 4 * *"
    open-pull-requests-limit: 20
    assignees:
      - "Author"
    versioning-strategy: "increase"
